[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsv4-vision-vllm"
version = "0.1.1"
description = "DeepSeek V4 Flash 0731 vision support for the pinned Anemll DSpark vLLM runtime"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSES/*.txt"]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
]

# vLLM calls this at engine startup in every worker process.
[project.entry-points."vllm.general_plugins"]
dsv4_vision = "dsv4_vision_vllm:register"

[tool.setuptools.packages.find]
where = ["src"]
